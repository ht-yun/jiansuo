<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业信息验证助手</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;padding:16px;color:#172033;background:#f5f7fa;font:14px/1.5 "Microsoft YaHei",sans-serif}
    h1{margin:0 0 12px;font-size:18px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    button{border:0;border-radius:5px;padding:8px 12px;background:#155eef;color:#fff;cursor:pointer;font-weight:600}
    button.secondary{background:#64748b}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:12px;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;white-space:pre-wrap}
    .hint{color:#667085;font-size:12px;margin:8px 0}
    .ok{color:#15803d}.warn{color:#b54708}.error{color:#b42318}
  </style>
</head>
<body>
  <h1>企业信息验证助手</h1>
  <p class="hint">请从企业查询项目前端点击“开始官网验证”。助手会自动连接当前任务，不需要复制任务编号或配对码。</p>
  <div class="actions">
    <button id="reconnect">重新连接当前验证</button>
    <button id="continue" class="secondary">我已完成验证，继续</button>
    <button id="capture" class="secondary">采集当前详情页</button>
    <button id="stop" class="secondary">停止采集</button>
  </div>
  <div id="status" class="status">等待项目前端发起验证。</div>
  <script src="popup.js"></script>
</body>
</html>
