spring:
  application:
    name: company-profile-query
  datasource:
    url: jdbc:h2:file:./data/company_profile;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  username: ""
  password: ""
  h2:
    console:
  enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: always

gsxt-access-control:
  min-company-interval-seconds: 90
  max-company-interval-seconds: 180
  max-companies-per-hour: 10
  blocked-cooldown-hours: 12

gsxt-captcha:
  test-mode: false
  # 超级鹰验证码自动识别。直接在此填写凭据；真实账号密码请勿提交到 git。
  enabled: false
  username: ""
  password: ""
  soft-id: ""
  code-type: 2005
  max-attempts: 3
